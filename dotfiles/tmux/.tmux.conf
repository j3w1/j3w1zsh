# ──────────────────────────────────────────────────────────────
# j3w1zsh tmux theme
# Background: #000000
# Foreground: #FFF1F1
# Accent:     #B00020 / #FF334D
# ──────────────────────────────────────────────────────────────

if-shell 'test -x /data/data/com.termux/files/usr/bin/zsh' \
  'set -g default-shell /data/data/com.termux/files/usr/bin/zsh; set -g default-command /data/data/com.termux/files/usr/bin/zsh' \
  'set -g default-shell /usr/bin/zsh; set -g default-command /usr/bin/zsh'

# Terminal and true-color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:RGB"

# Use Ctrl+A as the prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Responsive interaction.
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000

# Start numbering at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep pane paths when creating panes.
unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Vi-style copy mode.
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "~/.local/bin/j3w1zsh-clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "~/.local/bin/j3w1zsh-clipboard-copy"

# Reload configuration.
bind r source-file ~/.tmux.conf \; \
  display-message "j3w1zsh tmux configuration reloaded"

# Main status bar.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#FFF1F1,bg=#000000"

# Left: session name.
set -g status-left-length 40
set -g status-left \
  "#[fg=#FFFFFF,bg=#B00020,bold] 󰆍 #S #[fg=#B00020,bg=#000000]"

# Window tabs.
setw -g window-status-separator ""
setw -g window-status-format \
  "#[fg=#DFA0A0,bg=#000000] #I:#W "
setw -g window-status-current-format \
  "#[fg=#000000,bg=#FF334D,bold] #I:#W #[fg=#FF334D,bg=#000000]"

# Right: directory and clock.
set -g status-right-length 100
set -g status-right \
  "#[fg=#632A2A]#[fg=#FFF1F1,bg=#632A2A] #{pane_current_path} \
#[fg=#B00020,bg=#632A2A]#[fg=#FFFFFF,bg=#B00020,bold] %H:%M "

# Borders and messages.
set -g pane-border-style "fg=#632A2A"
set -g pane-active-border-style "fg=#FF334D"
set -g message-style "fg=#FFFFFF,bg=#B00020,bold"
set -g message-command-style "fg=#FFFFFF,bg=#52000E"

# Clock and copy-mode selection.
setw -g clock-mode-colour "#FF334D"
setw -g mode-style "fg=#FFFFFF,bg=#52000E,bold"

# New panes keep the current working directory.
bind-key n next-window
bind-key p previous-window

# Declarative device-local theme output overrides the built-in fallback when present.
if-shell 'test -f "$HOME/.config/j3w1zsh/generated/theme/theme.tmux.conf"' \
  'source-file "$HOME/.config/j3w1zsh/generated/theme/theme.tmux.conf"'
