# j3w1zsh Codex baseline. Only the documented Developer Docs MCP URL is
# continuously managed; policy values below are first-install defaults only.
# Authentication, installation IDs, sessions, plugins, and machine paths are never tracked.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
