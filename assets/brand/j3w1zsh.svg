  <rect id="terminal-bar" x="52" y="58" width="408" height="52" rx="22" fill="#B00020"/>
  <circle cx="88" cy="84" r="8" fill="#000000"/>
  <circle cx="116" cy="84" r="8" fill="#FF334D"/>
  <circle cx="144" cy="84" r="8" fill="#FFF1F1"/>
